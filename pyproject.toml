[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardd"
version = "0.1.0"
description = "CarDD - deteccion y segmentacion de danos en autos"
requires-python = ">=3.12"
# dependencies vacio a proposito: torch/torchvision via requirements-torch.txt.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
