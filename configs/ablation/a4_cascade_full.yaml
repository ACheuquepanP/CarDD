# CarDD · configs/ablation/a4_cascade_full.yaml
# Fila a4 (Equipo C, Fase 5) · Contrato C4·C3
#
# Delta sobre a0: reemplaza el detector por Cascade Mask R-CNN (3 stages de caja
# con IoU creciente). Hereda todo lo demás de a0 -> base. Un cambio por fila: la
# rama de cajas. La rama de máscara y el schedule no se tocan.
_base_: a0_baseline.yaml

model:
  detector:
    name: cascade_mask_rcnn
    num_stages: 3
    iou_thresholds:     [0.5, 0.6, 0.7]     # umbral de positivos por stage
    stage_loss_weights: [1.0, 0.5, 0.25]    # peso al plegar en loss_classifier/box_reg
    bbox_reg_weights:                        # precisión creciente del BoxCoder por stage
      - [10.0, 10.0,  5.0,  5.0]
      - [20.0, 20.0, 10.0, 10.0]
      - [30.0, 30.0, 15.0, 15.0]
output:
  dir: outputs/a4_cascade
