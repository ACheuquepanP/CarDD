# CarDD · baseline variante BACKBONE · DCN(backbone) & cascade & multiscale (Equipo C)
# DCNv2 modulada aplicada DENTRO del backbone (depthwise de stages 1-3 de
# ConvNeXt-V2), estilo paper CarDD (C3-C5). Comparar contra la variante NECK:
# idénticas salvo DÓNDE va el DCN. SIN neck dcn (evita doble deformable).
#   - multiscale -> data.image_min_size_ratios
#   - DCN        -> model.backbone = convnextv2_tiny_dcn   <-- la diferencia
#   - cascade    -> detector (3 stages de caja)
_base_: ../a0_baseline.yaml
data:
  image_min_size_ratios: [0.8, 0.9, 1.0, 1.1]
model:
  backbone:
    name: convnextv2_tiny_dcn
    pretrained: true
    dcn_stages: [1, 2, 3]
    dcn_offset_groups: 1
  detector:
    name: cascade_mask_rcnn
output:
  dir: outputs/base_dcnBACKBONE_cascade_ms