# CarDD · configs/ablation/custom/dsconv.yaml
# Fila custom §5.2 (Equipo C, Fase B) · Contrato C4·C3
# Delta sobre a0: inserta el neck DSConv (serpiente deformable) sobre el FPN.
# Residual -> si los offsets son ~0 al inicio, no degrada el FPN. Un cambio por fila.
_base_: ../a0_baseline.yaml
model:
  neck:
    name: dsconv
    kernel_size: 4
    extend_scope: 1.0
output:
  dir: outputs/dsconv
