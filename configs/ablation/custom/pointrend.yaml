# CarDD · ablación 1-a-1 · base(DCN-neck & cascade & ms) + PointRend solo
_base_: base_dcnNECK_cascade_ms.yaml
model:
  detector:
    name: cascade_mask_rcnn_composed
    loss_mods: []                 # explícito: sin clDice ni skeleton
    pointrend: True
    point_loss_weight: 1.0
    point_target_resolution: 112
    pointrend_cfg:
      in_channels: 288
      num_classes: 7
      train_num_points: 196
      oversample_ratio: 3.0
      importance_sample_ratio: 0.75
      subdivision_steps: 3
      subdivision_num_points: 196

output:
  dir: outputs/abl_pointrend