
# CarDD · baseline variante NECK · DCN(neck) & cascade & multiscale (Equipo C)
# DCNv2 modulada aplicada como NECK sobre el FPN. Comparar contra la variante
# BACKBONE (base_dcnBACKBONE_cascade_ms.yaml): idénticas salvo DÓNDE va el DCN.
#   - multiscale -> data.image_min_size_ratios (M resuelve base*ratio)
#   - DCN        -> model.neck (dcn modulated)   <-- la diferencia
#   - cascade    -> detector (3 stages de caja)
_base_: ../a0_baseline.yaml
data:
  image_min_size_ratios: [0.7, 0.85, 1.0, 1.2]
model:
  detector:
    name: cascade_mask_rcnn
  neck:
    name: dcn
    levels: ["0", "1", "2", "3", "pool"]
    kernel_size: 3
    modulated: true   
train:
  epochs: 30
  batch_size: 2               # físico (8 GB)
  grad_accum_steps: 8         # batch efectivo = 16
  optimizer:
    name: adamw
    lr: 0.0035
    weight_decay: 0.01
  scheduler:
    name: cosine
    warmup_steps: 1000  
output:
  dir: outputs/base_dcnNECK_cascade_ms

