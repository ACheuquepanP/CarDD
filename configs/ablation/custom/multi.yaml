# CarDD · baseline variante BACKBONE · DCN(backbone) & cascade & multiscale (Equipo C)
# DCNv2 modulada aplicada DENTRO del backbone (depthwise de stages 1-3 de
# ConvNeXt-V2), estilo paper CarDD (C3-C5). Comparar contra la variante NECK:
# idénticas salvo DÓNDE va el DCN. SIN neck dcn (evita doble deformable).
#   - multiscale -> data.image_min_size_ratios
#   - DCN        -> model.backbone = convnextv2_tiny_dcn   <-- la diferencia
#   - cascade    -> detector (3 stages de caja)
_base_: ../a0_baseline.yaml

data:
  image_min_size: 1333
  image_max_size: 1333
  image_min_size_ratios: null
  transforms:
    train:
      - {name: paper_hflip, p: 0.5}
      - {name: paper_multiscale, h_min: 640, h_max: 1200, width: 1333}
      
model:
  detector:
    name: cascade_mask_rcnn
    num_stages: 3
    iou_thresholds:     [0.5, 0.6, 0.7]     # umbral de positivos por stage
    stage_loss_weights: [1.0, 0.5, 0.25]    # peso al plegar en loss_classifier/box_reg
    bbox_reg_weights:                        # precisión creciente del BoxCoder por stage
      - [10.0, 10.0,  5.0,  5.0]
      - [20.0, 20.0, 10.0, 10.0]
      - [30.0, 30.0, 15.0, 15.0]

output:
  dir: outputs/multi_scaling
