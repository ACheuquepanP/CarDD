# configs/ablation/a0_baseline.yaml
# Baseline: Mask R-CNN + ConvNeXt-V2 Tiny, no ablation modules.
# Schedule comes from base.yaml and is not redeclared here.

_base_: ../backbones/convnextv2_tiny.yaml

model:
  rpn_anchor_sizes: [32, 64, 128, 256, 512]
  detector:
    name: cascade_mask_rcnn
    num_stages: 3
    iou_thresholds:     [0.5, 0.6, 0.7]
    stage_loss_weights: [1.0, 0.5, 0.25]
    bbox_reg_weights:
      - [10.0, 10.0,  5.0,  5.0]
      - [20.0, 20.0, 10.0, 10.0]
      - [30.0, 30.0, 15.0, 15.0]

output:
  dir: outputs/a0_baseline

data:
  batch_size: 1
  num_workers: 4

  # NSA switch. false -> only paper_hflip + paper_multiscale from base.yaml.
  # true -> inherits the full composition block from base (radial, mosaic,
  # mosaic_crop, copy_paste, mixup, class weights); then drop the two lines below.
  composition_aug:
    enabled: false
