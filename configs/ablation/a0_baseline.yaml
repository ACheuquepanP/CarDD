# configs/ablation/a0_baseline.yaml
# dueño: M · fase: 4 · contrato: C4 (entrada C1 · salida C2)
#
# Línea base: Mask R-CNN + ConvNeXt-V2 Tiny, sin módulos de ablación.
#
# FUENTE ÚNICA DEL SCHEDULE: vive en base.yaml (bloques `train` y `optim`),
# como constante entre filas, bajo custodia de P (misma lógica que `image_mean/std`).
# a0 NO redeclara el schedule: solo fija dónde escribir las salidas. Las filas
# a1–a4 heredan de a0 y cambian UNA sola cosa → el schedule queda fijo para todas.

_base_: ../backbones/convnextv2_tiny.yaml

output:
  dir: outputs/a0_baseline

# Unblock temporal: base.yaml trae estas claves vacías (→ None) y revientan en
# data/build.py. Lo correcto es que P las cure en base (son constantes globales);
# mientras tanto las fijo acá. Quitar cuando base.yaml tenga valor.
