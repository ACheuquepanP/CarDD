# CarDD · configs/base.yaml — config base (Fase 0, Equipo P) · Contrato C4
# INMUTABLE entre filas: las filas heredan con '_base_' y solo declaran su delta.
# Las CONSTANTES de proyecto (schedule, mean/std) viven aquí; curarlas es
# custodia de P, no un override por fila.

seed: 32
deterministic: false
 
data:
  root: data/CarDD_COCO
  num_classes: 6
  split: [0.7, 0.2, 0.1]
  image_min_size: 1000
  image_max_size: 1000
  image_min_size_ratios: null
  num_workers: 4
  persistent_workers: true
  transforms:
    train:
      - {name: paper_hflip, p: 0.5}
      - {name: paper_multiscale, h_min: 480, h_max: 960, width: 1000,
         size_divisible: 2, size_round: floor}   # múltiplo de stride (DCN)
  image_mean: [0.485, 0.456, 0.406]
  image_std:  [0.229, 0.224, 0.225]
  tiling:
    n: 3
    tile_frac: 0.5

  composition_aug:
    enabled: true

    # ── peso de imagen normal (referencia; los weights de augs son relativos) ──
    normal_weight: 1.0

    # ── pesos por clase: sesgan selección de fuente + guían recorte de mosaic_crop ──
    class_weights:
      enabled: true
      mode: max                    # combina si la imagen tiene varias clases: max|mean|sum
      weights: {dent: 2.5, scratch: 2.5, crack: 3.5}
      decay:
        curve: cosine              # linear|cosine|log|none
        end_factor: 0.3            # crack 1.5 → 1.3 hacia el final
        window: [0.0, 0.95]

    # ── augs de composición (lista de instancias; puedes repetir un type) ──
    augs:
      - type: radial
        window: [0, 0.4]
        weight: 25
        decay:   {curve: cosine, end: 20}
        enhance: {curve: linear, param: m_wedges, end: 6}
        params:  {n_sources: 4, m_wedges: 8, center_jitter: 0.25, center_shape: circle}

      - type: mosaic
        window: [0.3, 0.8]
        weight: 10
        decay:   {curve: linear, end: 6}
        enhance: {curve: linear, param: grid, end: 2}
        params:  {grid: 2, center_jitter: 0.2, center_shape: square}

      - type: mosaic_crop
        window: [0.4, 0.70]
        weight: 10
        params:  {grid: 2, crop_frac_min: 0.6, crop_frac_max: 1.0,
                  center_jitter: 0.25, center_shape: square}

      - type: copy_paste
        window: [0.1, 0.95]
        weight: 10
        enhance: {curve: linear, param: max_paste_instances, start: 4, end: 3}
        params:  {max_paste_instances: 6, min_paste_instances: 3,
                  min_visible_ratio: 0.10, blend: gaussian,
                  blur_sigma: 1.5, blur_ksize: 5, random_translate: false}

    # ── mixup (operador aparte: ventana + probabilidad + params) ──
    mixup:
      enabled: true
      window: [0, 0.85]
      p: 0.8
      decay:  {curve: linear, param: p, end: 0.5}
      params: {alpha_beta: 1.5, n_images: 2}

    # ── común ──
    min_area: 16
    avoid_self_pair: true
    debug_sample: 0.005

# --- Modelo (M afina en Fase 3; backbone-específico -> convnextv2_tiny.yaml) ---
model:
  detector:
    name: mask_rcnn
  backbone:
    name: convnextv2_tiny
    pretrained: true
    # checkpoint_path: Backbones/backbone_tiny.pth

# --- Entrenamiento: schedule = constante de proyecto, FIJO entre filas ---
train:
  epochs: 80
  batch_size: 1             # físico (8 GB)
  grad_accum_steps: 8       # batch efectivo = 16
  grad_clip: 1.0              # clip de norma del gradiente
  amp: true                   # precisión mixta
  optimizer:
    name: adamw
    lr: 0.0002
    weight_decay: 0.01
  scheduler:
    name: cosine
    warmup_steps: 350
    restarts: [0.40, 0.75]  # reinicia al 45% y 75% del training
    lr_mult: 0.25          # cada reinicio arranca a la mitad del pico anterior


  val_schedule:
    - {until_frac: 0.5,  every: 1}   # 1ª mitad: valida cada 3 épocas
    - {until_frac: 0.75, every: 1}   # 3er cuarto: cada 2
    - {until_frac: 1.0,  every: 1}   # último cuarto: cada 1
# --- Evaluación (Equipo E, Fase 2) ---
eval:
  metrics: [mask_AP, box_AP, AP50, AP75]
  per_class: true
  per_scale: true
  # Fusión por grafo de máscaras para el camino con tiling (M expone los knobs /
  # C fija los valores). Sin efecto en evaluate.py (sin tiling); solo lo lee
  # scripts/evaluate_tiled.py vía engine/inference.py. Defaults elegidos por
  # criterio, no por AP: containment reconcilia mejor las costuras; uniform es
  # el baseline honesto antes de probar feathered.
  fusion:
    match_metric: containment  # 'containment' = inter/min(area) | 'iou' clásico
    match_thr: 0.5             # solape mínimo de máscara para unir dos detecciones
    mask_weight: uniform       # 'uniform' | 'feathered' (ventana Hann hacia el borde)
    mask_thr: 0.5              # umbral de binarización (matching y bbox)
    score_reduce: max          # 'max' del grupo | 'wavg_area' ponderado por área
  # Sub-batch por tile en el forward (VRAM vs velocidad, nunca cambia el resultado).
  # null (default) -> hereda data.tiling.n (procesa de a "una fila" de la grilla
  # n x n en vez de los n^2 tiles juntos). 0 o negativo -> todos los tiles juntos
  # (comportamiento previo a este knob). Un entero explícito pisa el default.
  tile_batch_size: null

# --- Logging / salidas ---
output:
  dir: outputs
  log_every: 50
  tensorboard: true
